spring.application.name=${SPRING_APPLICATION_NAME:persona-resolver}
server.port=${SERVER_PORT:8080}

# RUI
app.sources.rui.base-url=${APP_SOURCES_RUI_BASE_URL:https://ventanillasocial.dnp.gov.co}
app.sources.rui.endpoint-path=${APP_SOURCES_RUI_ENDPOINT_PATH:/Home/ObtenerDatosRUI}
app.sources.rui.user-agent=${APP_SOURCES_RUI_USER_AGENT:Mozilla/5.0}

# Ventanilla Social esta detras de un balanceador KEMP y solo algunos nodos
# resuelven consultas RUI; el resto responde ok:false igual que una cedula
# inexistente. max-attempts es cuantas sesiones nuevas se prueban antes de dar
# una cedula por no encontrada. session-ttl-ms es cuanto se reutiliza una sesion
# que ya demostro servir, para no volver a rifar el nodo en cada consulta.
app.sources.rui.max-attempts=${APP_SOURCES_RUI_MAX_ATTEMPTS:8}
app.sources.rui.session-ttl-ms=${APP_SOURCES_RUI_SESSION_TTL_MS:600000}

# Tiempo total del sondeo de nodos. Peor caso ~ este valor + 5 s del ultimo
# intento. Tiene que quedar muy por debajo del timeout del proxy que tenga
# delante el backend, y en la practica por debajo de la paciencia de quien usa el
# formulario. Agotar el presupuesto da 503, no un 404 falso.
app.sources.rui.probe-budget-ms=${APP_SOURCES_RUI_PROBE_BUDGET_MS:12000}

# RUES
app.sources.rues.base-url=${APP_SOURCES_RUES_BASE_URL:https://app-antiguoprd.rues.org.co}
app.sources.rues.user-agent=${APP_SOURCES_RUES_USER_AGENT:Mozilla/5.0}

# Timeout de fuentes externas
app.scraper.timeout-ms=${APP_SCRAPER_TIMEOUT_MS:30000}

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/persona_resolver_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Los PostgreSQL serverless (Neon, por ejemplo) apagan el compute tras unos
# minutos sin actividad y suelen cobrar o limitar por horas de compute. Con el
# pool por defecto (10 conexiones siempre abiertas, renovadas y validadas
# periodicamente) un backend que pasa el dia encendido puede mantener la base
# despierta todo ese tiempo. Con minimum-idle=0 el pool cierra las conexiones
# tras idle-timeout sin uso y la base puede dormir entre consultas; la primera
# consulta despues paga su arranque (del orden de cientos de ms).
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:5}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:120000}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}